name: Deploy
run-name: "Deploying from \"${{ github.head_ref || github.ref_name }}\""

on:
  workflow_dispatch:
    inputs:
      target_deployment:
        type: choice
        description: ""
        required: true
        default: 'beta'
        options:
          - beta
      dry_run:
        description: "Workflow dry run"
        type: boolean
        default: false

jobs:
  target-deployment:
    name: Determine target deployment
    runs-on: ubuntu-latest
    
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false # Disable automatic npm caching if not required
    - run: |
        cd ./the-gateway-to-vue
        npm install
        npm run build