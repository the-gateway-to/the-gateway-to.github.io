name: Deploy
run-name: "Deploying from \"${{ github.head_ref || github.ref_name }}\""

on:
  workflow_dispatch:
    inputs:
      target_deployment:
        type: choice
        description: ""
        required: true
        default: 'beta'
        options:
          - beta
      dry_run:
        description: "Workflow dry run"
        type: boolean
        default: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build --if-present 
