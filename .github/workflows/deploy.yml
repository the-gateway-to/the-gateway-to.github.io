name: Deploy
run-name: "Deploying from \"${{ github.head_ref || github.ref_name }}\""

on:
  workflow_dispatch:
    inputs:
      target_deployment:
        type: choice
        description: ""
        required: true
        default: 'beta'
        options:
          - beta
      dry_run:
        description: "Workflow dry run"
        type: boolean
        default: false

jobs:
  target-deployment:
    name: Determine target deployment
    runs-on: ubuntu-latest
    
    steps:
    - name: checkout
      uses: actions/checkout@v6
    
    - name: setup node
      uses: actions/setup-node@v6

    - name: run build
      run: |
        ls -la
        cd ./the-gateway-to-vue
        npm install
        npm run build
        npm run deploy
